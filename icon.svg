  <path d="M256 300 C298 272 354 266 408 280 L408 404 C354 392 298 396 256 424 Z" fill="url(#pageR)"/>
  <path d="M256 300 L256 424" stroke="#1420a8" stroke-width="6" stroke-linecap="round" opacity=".35"/>
  <!-- lignes de texte -->
